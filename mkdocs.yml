site_name: Inference Engineering
site_description: A Markdown-first field guide with CPU-only inference engineering exercises.
docs_dir: docs
site_dir: site
strict: true
theme:
  name: mkdocs
markdown_extensions:
  - admonition
  - attr_list
  - tables
nav:
