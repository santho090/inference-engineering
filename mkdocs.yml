      - Request lifecycle and metrics: foundations/03-request-lifecycle.md
      - Measurement integrity: foundations/04-measurement-integrity.md
  - "Part II: understand the machine":
      - Transformer inference anatomy: hardware/05-transformer-anatomy.md
      - GPU execution and memory: hardware/06-gpu-execution.md
      - Roofline reasoning: hardware/07-roofline.md
      - Memory sizing: hardware/08-memory-sizing.md
  - "Part III: optimize one engine":
      - Level 1, kernel optimization: levels/09-kernel-optimization.md
      - Level 2, phase scheduling: levels/10-phase-scheduling.md
      - Level 3, cache management: levels/11-cache-management.md
      - Quantization, speculation, and parallelism: levels/12-runtime-levers.md
  - "Part IV: optimize the service":
      - Level 4, model and GPU pooling: production/13-pooling-and-placement.md
      - Level 5, cluster architecture: production/14-cluster-architecture.md
