[build-system]
requires = []
build-backend = "build_backend"
backend-path = ["scripts"]

[project]
name = "inference-engineering"
version = "0.1.0"
description = "A Markdown-first field guide with CPU-only inference engineering exercises."
readme = "README.md"
requires-python = ">=3.12"
license = "Apache-2.0"
license-files = ["LICENSE", "NOTICE"]
authors = [{ name = "Santhosh Vaithiyanathan" }]
classifiers = [
  "Development Status :: 3 - Alpha",
  "Intended Audience :: Developers",
  "License :: OSI Approved :: Apache Software License",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13",
  "Programming Language :: Python :: 3.14",
  "Topic :: Education",
]
dependencies = []

[project.optional-dependencies]
dev = [
  "mkdocs>=1.6,<2",
  "mypy>=1.13,<2",
  "ruff>=0.8,<1",
]

[project.scripts]
ie = "inference_engineering.cli:main"

[tool.ruff]
target-version = "py312"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "UP"]

[tool.ruff.format]
quote-style = "double"
indent-style = "space"
line-ending = "lf"

[tool.mypy]
python_version = "3.12"
strict = true
files = ["src", "tests", "scripts"]
warn_unused_configs = true

[tool.pytest.ini_options]
testpaths = ["tests"]
